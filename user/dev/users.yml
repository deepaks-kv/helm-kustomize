name: user-service
image:
  repo: deepak/user-service
port: 80
config:
  envs:
    POSTGRES_DB: users_db
    AWS_S3_BUCKET: deepak-org-user-queue-bucket
    AWS_S3_REGION: us-west-2
    AWS_QUEUE_URL: https://sqs.us-west-2.amazonaws.com/402338187344/deepak-org-user-queue-sqsfd2d479b049991a50356cc7e29
    POSTGRES_USERNAME: postgres
    POSTGRES_HOST: db
    PORT: "80"
  secrets:
    name: user-service-secret
health:
  path: /users/health
http:
  paths: [/users]
  hostnames:
    - kvsandbox.local
command: ["sh", "-c"]
args: ["npm run start"]
job:
  type: migration
  command: "npm run migrate"
