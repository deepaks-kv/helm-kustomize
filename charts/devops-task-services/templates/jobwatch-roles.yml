apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Values.name }}-job-watcher-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Values.name }}-job-watcher-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Values.name }}-job-watcher-rolebinding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.name }}-job-watcher-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $.Values.name }}-job-watcher-role
  apiGroup: rbac.authorization.k8s.io
