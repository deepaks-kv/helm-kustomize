{{- if $.Values.http }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Values.nameOverride }}-{{ $.Values.name }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $.Values.nameOverride }}
spec:
  parentRefs:
    - name: traefik-gateway 
      sectionName: web
      kind: Gateway
      namespace: default

  hostnames:
  {{- range $host := $.Values.http.hostnames }}
    - {{ $host }}
  {{- end }}


  rules:

    {{- range $path := $.Values.http.paths }}
     - matches:
        - path:
            type: PathPrefix
            value: {{ $path }}

       backendRefs:
        - name: {{ $.Values.name }}-svc
          port: {{ $.Values.port }}
    {{- end }}
{{- end }}